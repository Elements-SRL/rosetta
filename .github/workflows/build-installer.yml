name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, windows]

    env:
      # Vendor SDKs required by e384_rust's build.rs. These live on the runner
      # machine; none of them are vendored in this repo.
      E384C_INCLUDE_DIR: C:\Users\lross\development\e384c\include
      E384C_LIB_DIR: C:\Users\lross\development\e384c\build\Desktop_Qt_6_7_3_MSVC2022_64bit-Release
      E384COMMLIB_LIB_DIR: C:\ElemLibraries\e384CommLib\lib
      FTD2XX_LIB_DIR: C:\ElemLibraries\ftd2xx\lib\win\x64
      OKFRONTPANEL_LIB_DIR: C:\ElemLibraries\FrontPanel\lib\x64
      MPSSE_LIB_DIR: C:\ElemLibraries\libmpsse\lib
      CYAPI_LIB_DIR: C:\ElemLibraries\CyAPI\lib\x64
      FTDI_UTILS_LIB_DIR: C:\ElemLibraries\ftdi_utils\lib
      # Where the e384_rust checkout already lives on the runner.
      E384_RUST_DIR: C:\Users\lross\development\rust\e384_rust

    steps:
      - uses: actions/checkout@v4

      - name: Link e384_rust next to the workspace
        shell: pwsh
        run: |
          # Cargo.toml depends on `../rust/e384_rust`, relative to the repo root.
          # The workspace is $GITHUB_WORKSPACE, so create that sibling as a
          # junction to the copy that already exists on this machine.
          if (-not (Test-Path $env:E384_RUST_DIR)) {
            throw "e384_rust not found at $env:E384_RUST_DIR"
          }
          $link = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'rust\e384_rust'
          New-Item -ItemType Directory -Force -Path (Split-Path $link -Parent) | Out-Null
          if (Test-Path $link) {
            $existing = Get-Item $link -Force
            if (-not $existing.LinkType) {
              throw "$link exists and is a real directory, not a link. Remove it manually."
            }
            $existing.Delete()
          }
          New-Item -ItemType Junction -Path $link -Target $env:E384_RUST_DIR | Out-Null
          Write-Host "Linked $link -> $env:E384_RUST_DIR"

      - name: Build release binary
        shell: pwsh
        run: cargo build --release

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'rosetta' } |
            Select-Object -ExpandProperty version
          if (-not $version) { throw "Could not read the rosetta version from Cargo.toml" }
          Write-Host "rosetta version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Inno Setup Action
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: setup.iss
          options: /DMyAppVersion="${{ steps.version.outputs.version }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-setup
          path: installer/rosetta_setup.exe
          if-no-files-found: error
